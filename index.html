<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidScholar — AI Micro-Lecture Generator</title>
  <meta name="description" content="Convert your educational questions into 30-90 second animated video explanations. Curriculum-aligned, grade-adaptive AI learning.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"></div>
  <!-- API key bootstrap — runs before groq.js so the key is always in localStorage -->
  <script>
    (function() {
      var KEY_NAME = 'GROQ_API_KEY';
      // Load API key from environment variable or user settings
      // Set this in localStorage via the Settings page or environment
      if (!localStorage.getItem(KEY_NAME)) {
        // Prompt user to enter their API key on first load
        var key = localStorage.getItem(KEY_NAME);
        if (!key) {
          console.warn('GROQ_API_KEY not set. Please configure it in Settings.');
        }
      }
    })();
  </script>
  <script src="js/tesseract.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/topics.js"></script>
  <script src="js/groq.js"></script>
  <script src="js/animator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
